# Merge this ingress rule into your existing Cloudflare Tunnel configuration.
# Replace the tunnel ID and credentials path with values from your own tunnel.
tunnel: YOUR_TUNNEL_ID
credentials-file: /path/to/YOUR_TUNNEL_ID.json
ingress:
  - hostname: eglantine.jvrcruz.games
    service: http://localhost:39402
  - service: http_status:404
